<!DOCTYPE html>
<html lang="en">
<head>
  <title>SinkingFund Online</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ebeaf0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loader {
      position: fixed;
      inset: 0;
      background-color: #ebeaf0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }

    .spinner {
      border: 4px solid #d1cddc;
      border-top: 4px solid #059669;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.9s linear infinite;
    }

    .loader-label {
      font-size: 13px;
      font-weight: 700;
      color: #059669;
      letter-spacing: 0.4px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-label="Loading SinkingFund Online...">
    <div class="spinner"></div>
    <div class="loader-label">Loading SinkingFund Online…</div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwZNYQQOCvaeXY2odMjA5TZGlRmvBs_6wmU6IeBTvgzBnsfhxqZ7PQBQaURVrGJPCPf/exec"
    title="SinkingFund Online"
    allow="clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (!loader || loader.style.display === 'none') return;
      setTimeout(function () {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.style.display = 'none';
        }, 400);
      }, 300);
    }

    // Fallback: hide loader after 10 seconds if iframe onload is delayed
    setTimeout(hideLoader, 10000);
  </script>

</body>
</html>
